# Watches both halves of what the node tells an AI.
#
# The craft half is Shotstack's agent skill, vendored at a pinned commit. The
# allowed-values half is generated from @shotstack/schemas, pinned exact.
#
# CI already checks the generated files match the INSTALLED package. Nothing
# checked whether the installed package is still current, so the half that
# states what the API accepts could go stale while the vendored header tells
# the model it is the authority. Confidently wrong is worse than absent.
#
# A pin we can no longer fetch fails the job, because that breaks the vendoring
# silently. A pin that has merely moved on only reports, because it is deliberate.

name: Reference freshness

on:
  schedule:
    - cron: '0 9 * * 1' # Monday morning
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - run: npm ci

      - name: The pinned skill must still be fetchable, and match what we shipped
        # Runs the real script, not a copy of its file list, so the two cannot
        # drift. A moved file fails the fetch; a stale commit fails the diff.
        run: |
          node scripts/vendor-skill.mjs
          if ! git diff --quiet -- nodes/Shotstack/reference/skill.ts; then
            echo "::error::skill.ts does not match the pinned commit. Run: npm run vendor:skill"
            git diff --stat -- nodes/Shotstack/reference/skill.ts
            exit 1
          fi

      - name: Report whether the schema package is behind
        # Exact-pinned, so nothing bumps it on its own and no bot opens a PR.
        run: |
          pinned=$(node -p "require('./package.json').devDependencies['@shotstack/schemas']")
          latest=$(npm view @shotstack/schemas version 2>/dev/null || true)
          if [ -z "$latest" ]; then
            echo "::notice::Could not read npm. Schema version not compared."
          elif [ "$pinned" != "$latest" ]; then
            echo "::notice::@shotstack/schemas moved on: pinned $pinned, latest $latest. To take it: npm install @shotstack/schemas@latest, node scripts/build-reference.mjs, commit both."
          else
            echo "The schema pin is current at $pinned."
          fi

      - name: Report whether the pin is behind
        # The API is unauthenticated and runners share addresses, so a rate limit
        # must read as "did not find out", never as "upstream changed".
        run: |
          pinned=$(grep -oE "^const PIN = '[0-9a-f]{40}'" scripts/vendor-skill.mjs | grep -oE '[0-9a-f]{40}')
          latest=$(curl -sf -m 20 https://api.github.com/repos/shotstack/shotstack-cli/commits/master \
            | grep -m1 '"sha"' | cut -d'"' -f4 || true)
          if [ -z "$latest" ]; then
            echo "::notice::Could not read master (rate limit or outage). Pin not compared."
          elif [ "$pinned" != "$latest" ]; then
            echo "::notice::Skill moved on: pinned ${pinned:0:7}, master ${latest:0:7}. To take it: npm run vendor:skill -- --latest, set PIN, re-run without --latest, commit both files."
          else
            echo "The pin is current."
          fi
