name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

# Cancel in-progress runs for the same branch or pull request.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          # The default fetches one commit of one branch. The review checks read
          # the other branch and walk the log, so both would fail here.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Run lint
        run: 'npm run lint'

      - name: Run build
        run: 'npm run build'

      - name: Run tests
        run: 'npm test'

      - name: Run the review checks
        # The checks the other steps do not cover: n8n's verification
        # requirements, that the operations still follow the OpenAPI spec, and
        # the sanity sweeps for leftovers. Exits non-zero on any failure.
        run: 'node scripts/review-check.mjs'

