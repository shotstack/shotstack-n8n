name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
concurrency:
  # The n8n scaffold rendered this as a bare "$" (the same templating bug it has
  # in publish.yml). Left unfixed, every branch and PR shares one concurrency
  # group, so any push cancels unrelated in-flight runs.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Run lint
        run: 'npm run lint'

      - name: Run build
        run: 'npm run build'

      - name: Run tests
        run: 'npm test'

      - name: Check the AI reference is still in step with the spec
        # recipeReference.ts is generated. If someone edits it by hand, or
        # updates the spec without regenerating, the node would teach an AI a
        # version of the API that no longer exists. Rebuild and compare.
        run: |
          node scripts/build-reference.mjs
          if ! git diff --quiet -- nodes/Shotstack/reference/recipeReference.ts; then
            echo "recipeReference.ts is out of step with scripts/shotstack-openapi.json."
            echo "Run: node scripts/build-reference.mjs   then commit the result."
            git diff --stat -- nodes/Shotstack/reference/recipeReference.ts
            exit 1
          fi
