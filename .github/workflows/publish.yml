# Publishes to npm when a version tag is pushed.
#
# n8n requires community nodes to be published from CI with a provenance
# signature. What must be true before the first release is in RELEASING.md.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Mints the OIDC token npm needs to sign the provenance statement.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # The next step walks history, so it needs the whole thing.
          fetch-depth: 0

      - name: Refuse a tag that is not on main
        # The tag filter accepts a tag on any branch, so without this a tag on a
        # scratch branch publishes under the @shotstack name.
        #
        # Do not add a fetch here. A --depth=1 fetch would shallow the clone that
        # fetch-depth: 0 just made, and merge-base would then refuse every tag
        # except main's exact tip.
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME points at a commit that is not on main."
            echo "Merge to main first, then tag."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Run tests
        # A tag triggers neither ci.yml nor the release command's own hooks, so
        # without this step the release path runs no tests at all.
        run: 'npm test'

      - name: Check the AI reference is still in step with the spec
        run: |
          node scripts/build-reference.mjs
          if ! git diff --quiet -- nodes/Shotstack/reference/recipeReference.ts; then
            echo "recipeReference.ts is out of step with scripts/shotstack-openapi.json."
            echo "Run: node scripts/build-reference.mjs   then commit the result."
            exit 1
          fi

      - name: Send a prerelease to the "next" tag, not "latest"
        # npm publishes to latest unless told otherwise. It does not read the
        # version, so an rc tag would otherwise be served to every install.
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) echo "npm_config_tag=next" >> "$GITHUB_ENV"
                 echo "$GITHUB_REF_NAME is a prerelease. Publishing to the next tag." ;;
            *)   echo "$GITHUB_REF_NAME is a full release. Publishing to latest." ;;
          esac

      - name: Release
        # With no NPM_TOKEN set, npm authenticates through OIDC instead.
        run: |
          # An `if`, not `[ -n ... ] && ...`. GitHub runs this with bash -e, so
          # the && form exits 1 when NPM_TOKEN is unset and kills the step.
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          npm run release
        env:
          # The n8n scaffold ships this as a bare "$", which writes a junk token.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
